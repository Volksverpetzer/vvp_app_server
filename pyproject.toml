[project]
name = "vvp-app-server"
version = "0.1.0"
description = "Django backend for the Volksverpetzer / Mimikama apps"
requires-python = ">=3.12"
dependencies = [
    "exponent_server_sdk>=2.2.0,<3",
    "Django>=6.0.6,<7",
    "django-environ>=0.13.0,<1",
    "gunicorn>=26.0.0,<27",
    "postgres>=4.0,<5",
    "psycopg2-binary>=2.9.12,<3",
    "whitenoise>=6.12.0,<7",
    "stripe>=15.2.1,<16",
    "coverage>=7.14.1,<8",
    "google-api-python-client>=2.197.0,<3",
    "django-cors-headers>=4.9.0,<5",
    "cryptography>=50.0.1,<51",
    "djangorestframework>=3.17.1,<4",
    "django-q2>=1.10.0,<2",
    "django-bootstrap5>=26.2,<27",
    "Mastodon.py>=2.2.1,<3",
    "llama-index>=0.14.22,<0.15",
    "llama-index-embeddings-jinaai>=0.6.0,<0.7",
    "llama-index-vector-stores-pinecone>=0.8.0,<0.9",
    "pinecone>=7.3.0,<8",
    "markdown2>=2.5.5,<3",
    "newspaper4k>=0.9.5,<0.10",
    "lxml-html-clean>=0.4.4,<0.5",
    "lxml>=5.4.0,<6",
    "geopandas>=1.1.3,<2",
    "pandas>=3.0.3,<4",
    "matplotlib>=3.11.0,<4",
    "atproto>=0.0.68,<0.1",
    "pandas-stubs>=3.0.3.260530,<4",
    "django-stubs>=6.0.5,<7",
    "django-ratelimit>=4.1.0,<5",
    "defusedxml>=0.7.1,<0.8",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4,<2",
    "radon>=6.0.1,<7",
    "ruff>=0.15.13,<0.16",
    "pre-commit>=4.6.2,<5",
    "pip-audit>=2.10.1,<3",
]

[tool.ruff.lint]
select = ["E", "F", "DJ", "DTZ", "S", "PD"]
exclude = ["tests.py", "venv"]

[tool.bandit]
exclude = ["venv", "**/tests.py", "**/test_*.py", "**/tests/*.py"]
