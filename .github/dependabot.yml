version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
      prefix-development: chore
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: uv
    directory: /
    commit-message:
      prefix: chore
      prefix-development: chore
    schedule:
      interval: weekly
    # Same one-day release-age rule as for manual bumps
    cooldown:
      default-days: 1
    groups:
      # One PR per week for minor/patch updates; majors stay separate so
      # their changelogs get reviewed one by one
      uv-minor-and-patch:
        update-types: [minor, patch]
