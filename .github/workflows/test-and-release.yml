name: Test and Release
on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres: # we need a postgres docker image to be booted a side car service to run the tests that needs a db
        image: postgres
        env: # the environment variable must match with app/settings.py if block of DATBASES variable otherwise test will fail due to connectivity issue.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github-actions
        ports:
          - 5432:5432 # exposing 5432 port for application to use
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install -r requirements.txt --system

      - name: Run Tests
        run: |
          python manage.py test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/github-actions
          SECRET_KEY: password
          NOTIFICATION_BEARER: abcd
          DEBUG: enabled
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PLAUSIBLE_TOKEN: ${{ secrets.PLAUSIBLE_TOKEN }}
          GOOGLE_FACT: ${{ secrets.GOOGLE_FACT }}
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prerelease'
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: Set image tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "image_tag=latest" >> $GITHUB_OUTPUT
            echo "deploy_env=production" >> $GITHUB_OUTPUT
          else
            echo "image_tag=staging" >> $GITHUB_OUTPUT
            echo "deploy_env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v4
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}

      - name: Build the Docker image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} --build-arg BUILD_DATE=$(date -u +%Y%m%d%H%M%S) --build-arg DEPLOY_ENV=${{ steps.vars.outputs.deploy_env }} . -t ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image:${{ steps.vars.outputs.image_tag }}

      - name: Save Docker image
        run: docker save ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image:${{ steps.vars.outputs.image_tag }} > image.tar

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  docker-push-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prerelease'
    needs: [test, docker-build]
    steps:
      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v4
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: .

      - name: Load Docker image
        run: docker load < image.tar

      - name: Push the Docker Image
        run: |
          docker push ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image:${{ needs.docker-build.outputs.image_tag }}

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: |
          curl --fail-with-body -X POST \
            -H "X-Auth-Token: ${{ secrets.SCALEWAY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.scaleway.com/containers/v1beta1/regions/${{ secrets.SCALEWAY_REGION }}/containers/${{ secrets.SCALEWAY_SERVICE_ID }}/deploy"

      - name: Deploy to Staging
        if: github.ref == 'refs/heads/prerelease'
        run: |
          curl --fail-with-body -X POST \
            -H "X-Auth-Token: ${{ secrets.SCALEWAY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.scaleway.com/containers/v1beta1/regions/${{ secrets.SCALEWAY_REGION }}/containers/${{ secrets.SCALEWAY_STAGING_SERVICE_ID }}/deploy"
