name: Test and Deploy
on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    services:
      postgres: # we need a postgres docker image to be booted a side car service to run the tests that needs a db
        image: postgres
        env: # the environment variable must match with app/settings.py if block of DATBASES variable otherwise test will fail due to connectivity issue.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github-actions
        ports:
          - 5432:5432 # exposing 5432 port for application to use
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🏗 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked

      - name: 🏃‍♀️ Run tests
        run: |
          uv run python manage.py test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/github-actions
          SECRET_KEY: password
          NOTIFICATION_BEARER: abcd
          DEBUG: enabled
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PLAUSIBLE_TOKEN: ${{ secrets.PLAUSIBLE_TOKEN }}
          GOOGLE_FACT: ${{ secrets.GOOGLE_FACT }}
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}

  docker-build:
    name: 📦 Build Docker Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prerelease'
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🏷️ Set image tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "image_tag=latest" >> $GITHUB_OUTPUT
            echo "deploy_env=production" >> $GITHUB_OUTPUT
          else
            echo "image_tag=staging" >> $GITHUB_OUTPUT
            echo "deploy_env=staging" >> $GITHUB_OUTPUT
          fi
          # deploy_image is NOT a job output: GitHub Actions silently drops
          # any output whose value contains a secret (CONTAINER_REGISTRY_ENDPOINT
          # here), so it must be reconstructed inline from secrets + github.sha
          # wherever it's needed instead of passed between jobs.

      - name: 🔑 Login to Scaleway Container Registry
        uses: docker/login-action@v4
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}

      - name: 📦 Build the Docker image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} --build-arg BUILD_DATE=$(date -u +%Y%m%d%H%M%S) --build-arg DEPLOY_ENV=${{ steps.vars.outputs.deploy_env }} . -t ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image:${{ steps.vars.outputs.image_tag }} -t ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image:${{ github.sha }}

      - name: 💾 Save Docker image
        run: docker save ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image:${{ steps.vars.outputs.image_tag }} ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image:${{ github.sha }} > image.tar

      - name: ⬆️ Upload Docker image as artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  docker-push-deploy:
    name: 🚀 Push and Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prerelease'
    needs: [test, docker-build]
    # sha-tagging fixed *which* image a deploy targets, but not run ordering:
    # without this, an older push's deploy job can still finish PATCHing
    # after a newer push's, moving the container backwards. main (production)
    # and prerelease (staging) deploy to different SCALEWAY_SERVICE_IDs here,
    # so the group IS keyed by branch -- a staging deploy has no reason to
    # block or cancel a production one and vice versa.
    concurrency:
      group: scaleway-deploy-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: 🔑 Login to Scaleway Container Registry
        uses: docker/login-action@v4
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}

      - name: ⬇️ Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: .

      - name: 📦 Load Docker image
        run: docker load < image.tar

      - name: 🚀 Push the Docker image
        run: |
          docker push ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image:${{ needs.docker-build.outputs.image_tag }}
          docker push ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image:${{ github.sha }}

      - name: 🚀 Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: |
          # PATCH the container to the sha-tagged image (not :latest) so a
          # concurrent push to prerelease can't get deployed to production.
          curl --fail-with-body -X PATCH \
            -H "X-Auth-Token: ${{ secrets.SCALEWAY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"registry_image": "${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image:${{ github.sha }}"}' \
            "https://api.scaleway.com/containers/v1beta1/regions/${{ secrets.SCALEWAY_REGION }}/containers/${{ secrets.SCALEWAY_SERVICE_ID }}"

      - name: 🚀 Deploy to Staging
        if: github.ref == 'refs/heads/prerelease'
        run: |
          curl --fail-with-body -X PATCH \
            -H "X-Auth-Token: ${{ secrets.SCALEWAY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"registry_image": "${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image:${{ github.sha }}"}' \
            "https://api.scaleway.com/containers/v1beta1/regions/${{ secrets.SCALEWAY_REGION }}/containers/${{ secrets.SCALEWAY_STAGING_SERVICE_ID }}"
