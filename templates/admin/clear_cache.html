{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div id="content" class="colM">
  <h1>{% trans "Clear Cache" %}</h1>
  <p>{% trans "This action clears the following cache aliases:" %}</p>
  <ul>
    {% for alias in cache_aliases %}
      <li><code>{{ alias }}</code></li>
    {% endfor %}
  </ul>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="submit-row">
      <a href="{% url 'admin:index' %}" class="button cancel-link">{% trans "Cancel" %}</a>
      <button type="submit" class="button default">{% trans "Clear cache now" %}</button>
    </div>
  </form>
</div>
{% endblock %}
